name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore RemoteDesktop.sln

      - name: Protocol tests
        run: dotnet run --project tests/ProtocolTests/ProtocolTests.csproj -c Release

      - name: Build app
        run: msbuild src/RemoteDesktop.App/RemoteDesktop.App.csproj /restore /t:Build /p:Configuration=Release /p:Platform=x64

      - name: Publish app
        run: msbuild src/RemoteDesktop.App/RemoteDesktop.App.csproj /restore /t:Publish /p:Configuration=Release /p:Platform=x64 /p:RuntimeIdentifier=win-x64 /p:SelfContained=true /p:PublishDir=${{ github.workspace }}/publish/app/
