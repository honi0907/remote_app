name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore RemoteDesktop.sln

      - name: Protocol tests
        run: dotnet run --project tests/ProtocolTests/ProtocolTests.csproj -c Release

      - name: Build app
        run: dotnet build src/RemoteDesktop.App/RemoteDesktop.App.csproj -c Release -p:Platform=x64

      - name: Publish app
        run: dotnet publish src/RemoteDesktop.App/RemoteDesktop.App.csproj -c Release -r win-x64 -p:Platform=x64 --self-contained true -o publish/app
