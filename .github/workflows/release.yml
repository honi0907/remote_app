name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart('v')
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Restore and test
        run: |
          dotnet restore RemoteDesktop.sln
          dotnet run --project tests/ProtocolTests/ProtocolTests.csproj -c Release

      - name: Build
        run: msbuild src/RemoteDesktop.App/RemoteDesktop.App.csproj /restore /t:Publish /p:Configuration=Release /p:Platform=x64 /p:RuntimeIdentifier=win-x64 /p:SelfContained=true /p:Version=${{ steps.version.outputs.version }} /p:InformationalVersion=${{ steps.version.outputs.version }} /p:PublishDir=${{ github.workspace }}/publish/app/

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Build installer
        run: |
          iscc.exe "/DMyAppVersion=${{ steps.version.outputs.version }}" installer/RemoteDesktopLAN.iss

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/RemoteDesktopLAN-Setup-${{ steps.version.outputs.version }}-x64.exe
